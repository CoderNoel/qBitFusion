version: 2

updates:
  # Keeps the actions used by the workflows current. The pre-commit hook versions are not listed here:
  # they follow upstream qBittorrent and arrive with upstream merges.
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
    # Wait a week before proposing a new version, so a bad release is noticed by others first.
    cooldown:
      default-days: 7
