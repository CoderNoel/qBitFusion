# https://rumdl.dev/global-settings/
# https://rumdl.dev/rules/

[global]
enable = ["ALL"]
disable = [
    "MD013",
    "MD063",
    "MD082"
]

[MD046]
style = "fenced"

# qBitFusion: the README centers its logo and title with HTML; the pull request template is a form, not a document.
[per-file-ignores]
"README.md" = ["MD033", "MD041"]
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
