name: Bug report
description: Something in qBitFusion does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Before you submit:

        - Check whether the problem also happens in stock qBittorrent 5.3. If it does, report it to qBittorrent instead.
        - Search the existing issues, including closed ones.
        - **Remove private details** from everything you attach: provider account names, tokens, download links, IP addresses, and the names of what you download.
        - Security problems are reported privately, see the Security tab.

  - type: textarea
    attributes:
      label: Version and system
      description: The commit you built (`git describe --tags --always`) and your environment.
      placeholder: |
        qBitFusion commit:
        Operating system:
        Qt:
        libtorrent:
        Debrid provider (if relevant):
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      options:
        - Hybrid download (debrid / BitTorrent sources)
        - Interface
        - Build or install
        - Something else
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Log and screenshots
      description: |
        For a hybrid download problem, the lines starting with "Hybrid sources:" in the Log page are the most useful, together with the text of the Source column and its tooltip.
        Redact before pasting.
      render: text
    validations:
      required: false
