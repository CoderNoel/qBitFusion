name: Feature request
description: Suggest a change or an addition.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        - A request for something that stock qBittorrent should have too is better made upstream.
        - Requests to get around a debrid provider's limits, blocks or takedowns will be closed.
        - The open work this project already knows about is listed in the README.

  - type: textarea
    attributes:
      label: What would you like, and why?
      description: Describe the situation you are in, not only the solution you have in mind.
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Help
      options:
        - label: I could work on this myself
